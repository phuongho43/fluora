[project]
name = "fluora"
version = "0.1.0"
description = "Single-cell fluorescence trace analysis from timelapse microscopy"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "tifffile",
    "numpy",
    "pandas",
    "laptrack",
    "scikit-image",
    "scipy",
    "cellpose>=4.2.1.1",
    "matplotlib>=3.11.1",
    "pingouin",
    "statsmodels",
]
